# cek update mingguan buat paket python sm github actions (yg udah di-pin ke commit SHA)
# wajib cek dulu & jalanin eval sebelom merge; JANGAN merge update apa pun pas masa penjurian 16-24 Nov 2026!
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
