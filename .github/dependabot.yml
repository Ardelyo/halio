# Weekly update PRs for Python dependencies and GitHub Actions (pinned to commit SHAs).
# Review each PR and run the eval before merging; do not merge dependency updates during judging (16-24 Nov 2026).
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
