# cek otomatis tiap push / PR biar ga ada yg diem-diem pecah
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt pytest==9.2.0
      - run: cd backend && python -m pytest
      # pastin angka evaluasi offline masih sinkron sm eval/RESULTS.md
      - run: python eval/run_eval.py && git diff --exit-code -- eval/RESULTS.md
      # cek sintaks python, js ekstensi/web, sm build docker sekalian
      - run: python -m compileall -q backend scripts eval
      - run: for file in extension/*.js web/*.js; do node --check "$file"; done
      - run: docker build .
      # cek celah keamanan di paket python yg di-pin; sementra warning aja biar ga bikin gagal build kl advisories lg rewel
      - name: pip-audit (warning only)
        continue-on-error: true
        run: pip install pip-audit==2.9.0 && pip-audit -r backend/requirements.txt -r backend/requirements-optional.txt
