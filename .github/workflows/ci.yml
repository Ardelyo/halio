name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt pytest==9.2.0
      - run: cd backend && python -m pytest
      - run: python eval/run_eval.py && git diff --exit-code -- eval/RESULTS.md
      - run: python -m compileall -q backend scripts eval
      - run: for file in extension/*.js web/*.js; do node --check "$file"; done
      - run: docker build .
      # Known-vulnerability scan of the pinned Python dependencies. Warning only for now: it never fails the build.
      - name: pip-audit (warning only)
        continue-on-error: true
        run: pip install pip-audit==2.9.0 && pip-audit -r backend/requirements.txt -r backend/requirements-optional.txt
