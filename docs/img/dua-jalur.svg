<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Dua jalur pemeriksaan Halio: T1 luring dan T2 opsional dengan AI"><title>Dua jalur pemeriksaan Halio: T1 luring dan T2 opsional dengan AI</title><rect x="1" y="1" width="998" height="248" rx="20" fill="#FFFFFF" stroke="#E7E1DC" stroke-width="2"/><g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" fill="#0E1726"><text x="24" y="40" font-size="20" font-weight="700" fill="#0E1726" text-anchor="start">Dua jalur, satu keputusan dari kode</text><rect x="24" y="78" width="952" height="60" rx="12" fill="#F8F3F0"/><rect x="24" y="78" width="904" height="60" rx="12" fill="#067647" opacity=".13"/><rect x="24" y="78" width="8" height="60" rx="4" fill="#067647"/><text x="48" y="104" font-size="16" font-weight="700" fill="#067647" text-anchor="start">T1 luring</text><text x="48" y="124" font-size="13" font-weight="400" fill="#5B6475" text-anchor="start">TF-IDF + normalisasi frasa domain + registri buletin bertanda tangan</text><text x="956" y="114" font-size="13" font-weight="600" fill="#0E1726" text-anchor="end">tanpa AI, tanpa internet, ~2 ms</text><rect x="24" y="154" width="952" height="60" rx="12" fill="#F8F3F0"/><rect x="24" y="154" width="524" height="60" rx="12" fill="#014BAA" opacity=".13"/><rect x="24" y="154" width="8" height="60" rx="4" fill="#014BAA"/><text x="48" y="180" font-size="16" font-weight="700" fill="#014BAA" text-anchor="start">T2 opsional</text><text x="48" y="200" font-size="13" font-weight="400" fill="#5B6475" text-anchor="start">AI mencari halaman, kode menyalin kutipan lalu mencocokkan ulang kata per kata</text><text x="956" y="190" font-size="13" font-weight="600" fill="#0E1726" text-anchor="end">butuh jaringan dan kunci AI, 10 s - 3 menit</text></g></svg>
