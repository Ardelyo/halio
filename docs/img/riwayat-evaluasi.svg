<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" role="img" aria-label="Riwayat evaluasi Halio: recall holdout naik dari 81 ke 100 persen, salah tuduh turun dari 11 ke 0"><title>Riwayat evaluasi Halio: recall holdout naik dari 81 ke 100 persen, salah tuduh turun dari 11 ke 0</title><rect x="1" y="1" width="998" height="408" rx="20" fill="#FFFFFF" stroke="#E7E1DC" stroke-width="2"/><g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" fill="#0E1726"><text x="24" y="40" font-size="20" font-weight="700" fill="#0E1726" text-anchor="start">Riwayat evaluasi pada set tulisan tim</text><text x="24" y="62" font-size="13" font-weight="400" fill="#5B6475" text-anchor="start">Batang biru: recall hoaks parafrase di holdout. Titik merah: jumlah pernyataan benar yang salah dicap hoaks (dev + holdout).</text><line x1="70" y1="310" x2="960" y2="310" stroke="#E7E1DC" stroke-width="2"/><line x1="70" y1="262.5" x2="960" y2="262.5" stroke="#E7E1DC" stroke-dasharray="4 6"/><text x="60" y="266.5" font-size="12" font-weight="400" fill="#5B6475" text-anchor="end">25%</text><line x1="70" y1="215.0" x2="960" y2="215.0" stroke="#E7E1DC" stroke-dasharray="4 6"/><text x="60" y="219.0" font-size="12" font-weight="400" fill="#5B6475" text-anchor="end">50%</text><line x1="70" y1="167.5" x2="960" y2="167.5" stroke="#E7E1DC" stroke-dasharray="4 6"/><text x="60" y="171.5" font-size="12" font-weight="400" fill="#5B6475" text-anchor="end">75%</text><line x1="70" y1="120.0" x2="960" y2="120.0" stroke="#E7E1DC" stroke-dasharray="4 6"/><text x="60" y="124.0" font-size="12" font-weight="400" fill="#5B6475" text-anchor="end">100%</text><rect x="154" y="156.1" width="112" height="153.9" rx="10" fill="#014BAA"/><text x="210" y="146.1" font-size="20" font-weight="700" fill="#0E1726" text-anchor="middle">81%</text><circle cx="292" cy="288" r="15" fill="#B42318"/><text x="292" y="293" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">11</text><text x="210" y="336" font-size="13" font-weight="500" fill="#5B6475" text-anchor="middle">Sebelum penjaga</text><text x="210" y="354" font-size="13" font-weight="500" fill="#5B6475" text-anchor="middle">inti klaim</text><rect x="454" y="142.8" width="112" height="167.2" rx="10" fill="#014BAA"/><text x="510" y="132.8" font-size="20" font-weight="700" fill="#0E1726" text-anchor="middle">88%</text><circle cx="592" cy="288" r="15" fill="#B42318"/><text x="592" y="293" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="510" y="336" font-size="13" font-weight="500" fill="#5B6475" text-anchor="middle">Setelah penjaga</text><text x="510" y="354" font-size="13" font-weight="500" fill="#5B6475" text-anchor="middle">inti klaim</text><rect x="754" y="120.0" width="112" height="190.0" rx="10" fill="#5C8FD6"/><text x="810" y="110.0" font-size="20" font-weight="700" fill="#0E1726" text-anchor="middle">100%</text><circle cx="892" cy="288" r="15" fill="#067647"/><text x="892" y="293" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">0</text><text x="810" y="336" font-size="13" font-weight="500" fill="#5B6475" text-anchor="middle">v1.0</text><text x="810" y="354" font-size="13" font-weight="500" fill="#5B6475" text-anchor="middle">(disetel)</text><text x="960" y="392" font-size="12" font-weight="600" fill="#B54708" text-anchor="end">Holdout sudah tidak bersih: 100% adalah angka yang disetel, bukan estimasi akurasi.</text></g></svg>
